name: Deploy Jenkins to EC2

on:
  push:
    branches:
      - docker   # Change if you want another branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   # ✅ your AWS region

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin 971422682418.dkr.ecr.us-east-1.amazonaws.com

      - name: Build, Tag, and Push Image to ECR
        run: |
          IMAGE_TAG=latest
          ECR_REGISTRY=971422682418.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY=jenkins

          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export AWS_REGION=us-east-1
            export ECR_REGISTRY=971422682418.dkr.ecr.us-east-1.amazonaws.com
            export ECR_REPOSITORY=jenkins
            export IMAGE_TAG=latest

            # Login to ECR inside EC2
            docker login -u AWS -p $(aws ecr get-login-password --region $AWS_REGION) $ECR_REGISTRY

            # Pull latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Stop & remove old container if running
            docker stop jenkins || true
            docker rm jenkins || true

            # Run new container
            docker run -d --name jenkins -p 8080:8080 -p 50000:50000 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
