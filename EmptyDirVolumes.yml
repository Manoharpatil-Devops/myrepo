apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html

    - name: busybox-container
      image: busybox
      command: ["sh", "-c", "echo 'Hello from BusyBox' > /data/index.html && sleep 3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /data

    - name: alpine-container
      image: alpine
      command: ["sh", "-c", "while true; do echo 'Alpine running'; sleep 10; done"]
      volumeMounts:
        - name: shared-data
          mountPath: /alpine-data

  volumes:
    - name: shared-data
      emptyDir: {}
