<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to My Apache Server</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        h1 {
            margin-top: 60px;
            font-size: 3em;
        }

        p {
            font-size: 1.2em;
            margin-top: 10px;
        }

        .emoji {
            font-size: 2.5em;
            margin: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .status {
            font-size: 1.5em;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }

        .clock {
            font-size: 2em;
            margin-top: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            background-color: #ffffff22;
            color: white;
            border: 1px solid white;
        }

        iframe {
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🚀 Apache Web Server is Online!</h1>
    <p>Welcome to my interactive, animated Apache test page 🎉</p>
    <div class="emoji">🌐💻🔥</div>
    <div class="status">✅ Status: Running Smoothly</div>
    
    <!-- 🕒 Real-Time Clock -->
    <div class="clock" id="clock">--:--:--</div>

    <!-- 🎵 Music Play Button -->
    <button onclick="document.getElementById('bg-music').play()">🎵 Play Background Music</button>
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/10/31/audio_f1966a87f5.mp3?filename=relaxing-music-ambient-11749.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- 📺 YouTube Video Play Button -->
    <button onclick="loadVideo()">▶️ Play Special YouTube Video</button>
    <div id="video-container"></div>

    <!-- 🎊 Confetti Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        setInterval(() => {
            confetti({
                particleCount: 80,
                spread: 60,
                origin: { y: 0.6 }
            });
        }, 3000);
    </script>

    <!-- ▶️ YouTube Loader -->
    <script>
        function loadVideo() {
            const videoHTML = `
                <iframe width="560" height="315"
                    src="https://www.youtube.com/embed/rBLCjz8as0E?autoplay=1"
                    title="YouTube video" frameborder="0"
                    allow="autoplay; encrypted-media" allowfullscreen>
                </iframe>`;
            document.getElementById('video-container').innerHTML = videoHTML;
        }
    </script>

    <!-- ⏰ Clock Script -->
    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock(); // Run once immediately
    </script>

</body>
</html>
